<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Taylor Bosier</title>
<meta name="robots" content="noindex">

<link rel="icon" href="/assets/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/styles.css">

<script>
(function () {
  // Marks the document as script-enabled; the scroll-reveal styles only hide
  // content when this class is present, so a JS failure can never blank the page.
  document.documentElement.classList.add("js");
  try {
    var stored = localStorage.getItem("theme");
    var dark = stored ? stored === "dark"
                      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
</head>

<body>
<main class="container error-page">
  <p class="code rise">404</p>
  <h1 class="section__title rise" style="--rise-delay:120ms">This page isn't in the dataset.</h1>
  <p class="section__intro rise" style="--rise-delay:200ms">The link is broken or the page has moved.</p>
  <p class="rise" style="--rise-delay:280ms; margin-top:1.5rem">
    <a class="btn btn--primary" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Back home
    </a>
  </p>
</main>
</body>
</html>
