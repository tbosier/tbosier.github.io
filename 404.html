<!DOCTYPE html>
<html lang="en" data-style="dossier" data-accent="brass">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found, Taylor Bosier</title>
<meta name="robots" content="noindex">

<link rel="icon" href="/assets/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..700;1,6..72,200..700&family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;1,200;1,300;1,400&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="/assets/css/style-dossier.css">
<link rel="stylesheet" href="/assets/css/accents.css">

<script>
(function () {
  // Marks the document as script-enabled; the scroll-reveal styles only hide
  // content when this class is present. If main.js never boots (blocked, 404,
  // parse error) nothing would ever reveal it, so drop the class after a beat
  // and let the page render plainly rather than blank.
  var root = document.documentElement;
  root.classList.add("js");
  setTimeout(function () {
    if (root.getAttribute("data-booted") !== "1") root.classList.remove("js");
  }, 2500);
  // The design and its accent, set before first paint alongside the theme so
  // the page never flashes the wrong one. The published site is Dossier in
  // brass, and those two attributes are already on <html> in the markup, so
  // this runs correctly even with the script blocked -- it only handles
  // overrides.
  //
  // ?style= and ?accent= are honoured anywhere, which is how a variant gets
  // shared as a link; both are matched against a fixed list, so an unknown
  // value cannot inject anything. The remembered choice in localStorage is
  // deliberately NOT honoured in public: it belongs to the review harness,
  // which itself only runs locally, and a stale key from a design session
  // should not quietly serve a visitor a colour that was never chosen.
  try {
    var host = location.hostname;
    var lab = host === "localhost" || host === "127.0.0.1" || host === "::1" ||
              host === "[::1]" || host === "0.0.0.0" ||
              location.protocol === "file:" || /[?&]lab(=|&|$)/.test(location.search);

    var m = location.search.match(/[?&]style=([^&]*)/);
    var st = m ? m[1] : (lab ? localStorage.getItem("designStyle") : null);
    if (st !== null && m) {
      // an explicit ?style= may also turn the design OFF, to see the base
      document.documentElement.setAttribute("data-style", /^dossier$/.test(st) ? "dossier" : "");
    } else if (st && /^dossier$/.test(st)) {
      document.documentElement.setAttribute("data-style", st);
    } else if (st === "" && lab) {
      document.documentElement.setAttribute("data-style", "");
    }

    var am = location.search.match(/[?&]accent=([^&]*)/);
    var ac = am ? am[1] : (lab ? localStorage.getItem("designAccent") : null);
    if (ac && /^(amber|brass|sage|ice|rose|vermilion|bone)$/.test(ac)) {
      document.documentElement.setAttribute("data-accent", ac);
    }
  } catch (e) {}
  try {
    var stored = localStorage.getItem("theme");
    var dark = stored ? stored === "dark"
                      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
</head>

<body>
<main class="container error-page">
  <p class="code rise">404</p>
  <h1 class="section__title rise" style="--rise-delay:120ms">This page isn't in the dataset.</h1>
  <p class="section__intro rise" style="--rise-delay:200ms">The link is broken or the page has moved.</p>
  <p class="rise" style="--rise-delay:280ms; margin-top:1.5rem">
    <a class="btn btn--primary" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Back home
    </a>
  </p>
</main>
<script src="/assets/js/style-switch.js" defer></script>
<script src="/assets/js/style-extras.js" defer></script>
</body>
</html>
